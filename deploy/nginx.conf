# Nginx site config for the static export, served from a Hostinger VPS.
#
# Install: copy to /etc/nginx/sites-available/canorous.com, symlink into
# sites-enabled, then `certbot --nginx -d canorous.com -d www.canorous.com`
# to fill in the TLS block (certbot rewrites this file in place — the
# `listen 443` / ssl_certificate lines below are placeholders for that step).
#
# Replace canorous.com and /var/www/canorous.com/out below with the real
# domain and deploy path (must match VPS_PATH used by the GitHub Actions
# deploy workflow).

server {
    listen 80;
    listen [::]:80;
    server_name canorous.com www.canorous.com;

    # certbot will add a 301 to https here once TLS is issued.
    root /var/www/canorous.com/out;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml font/woff2;

    # brotli_static picks up pre-compressed .br files if you add them at
    # build time; harmless (falls through to gzip) if the module isn't
    # installed. Comment out if ngx_brotli isn't compiled in.
    # brotli on;
    # brotli_static on;

    # Hashed Next.js build assets never change content under a given
    # filename — cache them for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML must revalidate so deploys show up immediately.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        # trailingSlash: true in next.config.ts means every route is a
        # directory with its own index.html — try that before falling back.
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Adjust connect-src if the contact/quote forms post to a different
    # third-party form endpoint than the one listed here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.web3forms.com https://www.google-analytics.com; frame-ancestors 'none'" always;
}
